# Server block do Nginx para "Sessao a Dois" (sessaoadois.luisgosampaio.com).
#
# Este bloco serve o frontend estatico (SPA React/Vite) e faz proxy reverso
# para a API Spring Boot (publicada em localhost:8085 pelo docker-compose-prod.yml,
# via ${API_PORT:-8085}:8080) e para o endpoint WebSocket/STOMP (/ws).
#
# ---------------------------------------------------------------------------
# PASSOS MANUAIS NA VPS (nao executados pelo Ralph):
#   1. Copie este arquivo para /etc/nginx/sites-available/:
#        sudo cp deploy/nginx/sessaoadois.luisgosampaio.com.conf \
#                /etc/nginx/sites-available/sessaoadois.luisgosampaio.com
#   2. Crie o symlink para habilitar o site:
#        sudo ln -s /etc/nginx/sites-available/sessaoadois.luisgosampaio.com \
#                   /etc/nginx/sites-enabled/
#   3. Envie o build estatico do frontend para o root configurado
#        (client/dist -> /var/www/sessaoadois). Veja scripts/deploy.sh.
#   4. Valide e recarregue o Nginx:
#        sudo nginx -t && sudo systemctl reload nginx
#   5. Emita/instale o certificado SSL com Certbot (adiciona automaticamente o
#      bloco 443/SSL e o redirect 80 -> 443):
#        sudo certbot --nginx -d sessaoadois.luisgosampaio.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name sessaoadois.luisgosampaio.com;

    # Frontend estatico (build de producao do Vite enviado por SCP).
    root /var/www/sessaoadois;
    index index.html;

    # Fallback da SPA: qualquer rota que nao seja arquivo/diretorio real
    # cai no index.html para o React Router resolver client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST. SEM barra final no proxy_pass para PRESERVAR o prefixo /api
    # que os controllers Spring esperam (ex.: /api/tracking -> localhost:8085/api/tracking).
    location /api/ {
        proxy_pass http://localhost:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket/STOMP (SockJS + Spring). proxy_pass COM /ws/ final; requer
    # HTTP/1.1 e os headers de Upgrade/Connection para manter a conexao aberta.
    # access_log off: o handshake carrega o JWT na query string (?token=...);
    # logar essa URL gravaria uma credencial valida em texto claro em disco a
    # cada conexao. Ver docs/DEPLOY.md, secao "Seguranca operacional".
    location /ws/ {
        access_log off;
        proxy_pass http://localhost:8085/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# ---------------------------------------------------------------------------
# Bloco 443/SSL - normalmente gerado e mantido automaticamente pelo Certbot
# (`sudo certbot --nginx -d sessaoadois.luisgosampaio.com`), que copia as
# locations acima do bloco 80 para ca e adiciona `listen 443 ssl;` +
# `ssl_certificate`/`ssl_certificate_key`. Ele esta declarado aqui, no repo,
# so para que os 4 headers de seguranca abaixo tenham um lugar versionado -
# na VPS, eles precisam ser colados manualmente dentro do bloco 443 que o
# Certbot ja gerou (o certbot NAO sabe desses headers e os omite). Se o
# certificado for reemitido do zero (`certbot --nginx` de novo, ou renovacao
# com `--force-renewal`), o Certbot reescreve este bloco e os headers
# precisam ser reaplicados manualmente. Ver docs/DEPLOY.md, secao
# "Seguranca operacional".
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sessaoadois.luisgosampaio.com;

    # Gerenciado pelo Certbot - caminhos reais na VPS, nao versionados aqui.
    # ssl_certificate /etc/letsencrypt/live/sessaoadois.luisgosampaio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sessaoadois.luisgosampaio.com/privkey.pem;

    # Headers de seguranca HTTP (T4.x). `always` garante o envio tambem em
    # respostas de erro (4xx/5xx), nao so 2xx.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://image.tmdb.org data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss://sessaoadois.luisgosampaio.com; frame-ancestors 'none'; base-uri 'self'" always;

    root /var/www/sessaoadois;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        access_log off;
        proxy_pass http://localhost:8085/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
