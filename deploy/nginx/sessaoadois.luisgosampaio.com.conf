# Server block do Nginx para "Sessao a Dois" (sessaoadois.luisgosampaio.com).
#
# Este bloco serve o frontend estatico (SPA React/Vite) e faz proxy reverso
# para a API Spring Boot (publicada em localhost:8085 pelo docker-compose-prod.yml,
# via ${API_PORT:-8085}:8080) e para o endpoint WebSocket/STOMP (/ws).
#
# ---------------------------------------------------------------------------
# PASSOS MANUAIS NA VPS (nao executados pelo Ralph):
#   1. Copie este arquivo para /etc/nginx/sites-available/:
#        sudo cp deploy/nginx/sessaoadois.luisgosampaio.com.conf \
#                /etc/nginx/sites-available/sessaoadois.luisgosampaio.com
#   2. Crie o symlink para habilitar o site:
#        sudo ln -s /etc/nginx/sites-available/sessaoadois.luisgosampaio.com \
#                   /etc/nginx/sites-enabled/
#   3. Envie o build estatico do frontend para o root configurado
#        (client/dist -> /var/www/sessaoadois). Veja scripts/deploy.sh.
#   4. Valide e recarregue o Nginx:
#        sudo nginx -t && sudo systemctl reload nginx
#   5. Emita/instale o certificado SSL com Certbot (adiciona automaticamente o
#      bloco 443/SSL e o redirect 80 -> 443):
#        sudo certbot --nginx -d sessaoadois.luisgosampaio.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name sessaoadois.luisgosampaio.com;

    # Frontend estatico (build de producao do Vite enviado por SCP).
    root /var/www/sessaoadois;
    index index.html;

    # Fallback da SPA: qualquer rota que nao seja arquivo/diretorio real
    # cai no index.html para o React Router resolver client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST. SEM barra final no proxy_pass para PRESERVAR o prefixo /api
    # que os controllers Spring esperam (ex.: /api/tracking -> localhost:8085/api/tracking).
    location /api/ {
        proxy_pass http://localhost:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket/STOMP (SockJS + Spring). proxy_pass COM /ws/ final; requer
    # HTTP/1.1 e os headers de Upgrade/Connection para manter a conexao aberta.
    location /ws/ {
        proxy_pass http://localhost:8085/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
