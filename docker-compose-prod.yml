services:
  api:
    image: sessao-api:latest
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      # SPRING_FLYWAY_BASELINE_ON_MIGRATE foi REMOVIDO daqui (Epico 8, 2026-08-06).
      # Producao ja tem flyway_schema_history com V1..V6; com a variavel ligada,
      # uma migration que nao aplicasse seria mascarada como baseline em vez de
      # quebrar o deploy. Um ambiente NOVO (schema pre-existente sem historico)
      # passa a variavel pontualmente na propria linha de comando -- ver
      # docs/DEPLOY.md ("Ambiente novo com schema pre-existente") e docs/FLYWAY.md.
    ports:
      - "${API_PORT:-8085}:8080"
    # Trilha de auditoria de seguranca (com.app.security.SecurityAuditLogger, US-012/US-013):
    # bind mount de um diretorio da VPS para o mesmo caminho default do
    # RollingFileAppender (app.security.audit-log.path em application.properties),
    # para que sobreviva a `docker compose down` + `up` (etapa 5/5 do
    # scripts/deploy.sh). Ver docs/DEPLOY.md para o passo de criar o
    # diretorio na VPS antes do primeiro deploy com esta mudanca.
    volumes:
      - /var/lib/sessao-a-dois/security-audit-logs:/var/log/sessao-a-dois
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
