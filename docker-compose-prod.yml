services:
  api:
    image: sessao-api:latest
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      TMDB_API_KEY: ${TMDB_API_KEY}
    ports:
      - "${API_PORT:-8085}:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
