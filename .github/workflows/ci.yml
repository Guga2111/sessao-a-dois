name: CI - Unit Tests

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Run Unit Tests (API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sessao
          POSTGRES_USER: sessao
          POSTGRES_PASSWORD: sessao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sessao -d sessao"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: api
        run: ./mvnw -B test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sessao
          DB_USER: sessao
          DB_PASSWORD: sessao
          JWT_SECRET: ci-only-secret-please-override-in-prod-32bytes+
          CORS_ALLOWED_ORIGIN: http://localhost:5173
