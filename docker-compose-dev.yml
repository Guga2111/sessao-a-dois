# Ambiente de desenvolvimento local: PostgreSQL + PgAdmin + API.
# Suba com: docker compose -f docker-compose-dev.yml up -d
# Imagens escolhidas por terem suporte nativo a ARM64 (Apple Silicon) e x86_64.
#
# Credenciais de conexao (db=sessao, user=sessao, senha=sessao) sao os defaults
# de desenvolvimento reutilizados pelos defaults da API na US-003
# (ex.: DB_URL=jdbc:postgresql://localhost:5432/sessao, DB_USER/DB_PASSWORD=sessao).

services:
  postgres:
    image: postgres:17-alpine
    container_name: sessao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sessao
      POSTGRES_USER: sessao
      POSTGRES_PASSWORD: sessao
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessao -d sessao"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: sessao-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sessao.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
    container_name: sessao-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sessao
      DB_USER: sessao
      DB_PASSWORD: sessao
      JWT_SECRET: local-dev-compose-secret-not-for-prod-32bytes+
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      # TMDB_API_KEY: obrigatoria (com.app.media.TmdbConfig falha ao subir sem
      # ela). Lida do .env na raiz do repo (docker compose carrega .env
      # automaticamente) ou de uma env var exportada no shell. Veja .env.example.
      TMDB_API_KEY: ${TMDB_API_KEY:?defina TMDB_API_KEY no .env ou no ambiente - veja .env.example}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
