# Overrides para testes com contexto Spring completo (@SpringBootTest).
# ATENCAO: src/test/resources/application.properties nao e mesclado com
# src/main/resources/application.properties - o Spring Boot carrega apenas
# um application.properties por classpath root, entao este arquivo SUBSTITUI
# o de main inteiramente para qualquer teste que suba o contexto completo.
# Por isso ele precisa redeclarar tudo que os beans de producao exigem, nao
# apenas a propriedade que motivou sua criacao.

# TMDB_API_KEY nao costuma estar definida no ambiente de CI/local de testes;
# um valor fake evita o fail-fast de TmdbConfig sem exercitar o TMDB real.
tmdb.api-key=test-tmdb-api-key

# Precisa ser redeclarado aqui tambem: TmdbConfig e instanciado ansiosamente e este
# arquivo SUBSTITUI (nao mescla com) o application.properties principal nos testes.
tmdb.connect-timeout=3s
tmdb.read-timeout=5s

# JwtService (com.app.security) exige app.jwt.secret (min. 32 bytes p/ HS256);
# sem isso a criacao do bean falha e qualquer @SpringBootTest com contexto
# completo (ex.: SessaoADoisApplicationTests) quebra na inicializacao.
app.jwt.secret=test-only-secret-please-override-in-prod-32bytes+
app.jwt.expiration-days=7

# Em testes: Flyway desabilitado; Hibernate cria/destroi o schema direto das
# entidades JPA (create-drop). Razoes:
# 1. @DataJpaTest injeta spring.test.database.replace=ANY via PropertyMappingContextCustomizer,
#    que tem precedencia sobre application.properties -- ignorando qualquer
#    spring.test.database.replace=none aqui declarado e criando um H2 puro (sem
#    MODE=PostgreSQL), incompativel com a sintaxe Postgres das migrations.
# 2. @DataJpaTest desabilita Flyway por padrao no seu slice, mas spring.flyway.enabled=true
#    aqui sobrescrevia esse padrao, forcando Flyway contra o H2 errado.
# O schema de producao e governado pelas migrations (V1, V2, ...); o schema de
# teste e equivalente pois e derivado das mesmas entidades JPA.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Mirrors main's setting so @SpringBootTest slices exercise the same OSIV-off behavior as
# production (a lazy access outside a transaction must fail here too, not only in prod).
spring.jpa.open-in-view=false
