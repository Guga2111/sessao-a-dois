# Overrides para testes com contexto Spring completo (@SpringBootTest).
# ATENCAO: src/test/resources/application.properties nao e mesclado com
# src/main/resources/application.properties - o Spring Boot carrega apenas
# um application.properties por classpath root, entao este arquivo SUBSTITUI
# o de main inteiramente para qualquer teste que suba o contexto completo.
# Por isso ele precisa redeclarar tudo que os beans de producao exigem, nao
# apenas a propriedade que motivou sua criacao.

# TMDB_API_KEY nao costuma estar definida no ambiente de CI/local de testes;
# um valor fake evita o fail-fast de TmdbConfig sem exercitar o TMDB real.
tmdb.api-key=test-tmdb-api-key

# JwtService (com.app.security) exige app.jwt.secret (min. 32 bytes p/ HS256);
# sem isso a criacao do bean falha e qualquer @SpringBootTest com contexto
# completo (ex.: SessaoADoisApplicationTests) quebra na inicializacao.
app.jwt.secret=test-only-secret-please-override-in-prod-32bytes+
