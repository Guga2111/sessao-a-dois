spring.application.name=sessao-a-dois

# Datasource: le variaveis de ambiente com defaults de DEV consistentes com
# docker-compose-dev.yml (db=sessao, user=sessao, senha=sessao em localhost:5432).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sessao}
spring.datasource.username=${DB_USER:sessao}
spring.datasource.password=${DB_PASSWORD:sessao}

# DEV: deixa o Hibernate ajustar o schema conforme entidades forem surgindo.
spring.jpa.hibernate.ddl-auto=update

# JWT: segredo (min. 32 bytes para HS256) e expiracao em dias, sobrescrevivel via env var.
app.jwt.secret=${JWT_SECRET:dev-only-secret-please-override-in-prod-32bytes+}
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# CORS: origem do frontend (Vite dev server), sobrescrevivel via env var.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# TMDB: base URL fixa e API Key obrigatoria via env var (sem default -> fail-fast em TmdbConfig se ausente).
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.api-key=${TMDB_API_KEY:}
