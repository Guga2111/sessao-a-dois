spring.application.name=sessao-a-dois

# Datasource: le variaveis de ambiente com defaults de DEV consistentes com
# docker-compose-dev.yml (db=sessao, user=sessao, senha=sessao em localhost:5432).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sessao}
spring.datasource.username=${DB_USER:sessao}
spring.datasource.password=${DB_PASSWORD:sessao}

# Flyway e a unica fonte de verdade do schema (V1 = baseline de producao,
# V2+ = evolucoes incrementais); Hibernate so valida que as entidades JPA
# batem com o schema criado pelas migrations, nunca o altera.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate e baseline-version NAO estao aqui intencionalmente.
# Em Flyway 10.x, baseline-on-migrate=true marca V1 como baseline sem executa-la
# mesmo em banco VAZIO -- o que quebra dev/test/CI (schema nao e criado).
# Para o primeiro deploy contra o Supabase (schema existente sem flyway_schema_history),
# passe via variavel de ambiente: SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
# Ver docs/FLYWAY.md para o procedimento completo.
spring.jpa.hibernate.ddl-auto=validate

# Fail fast on lazy access outside a transaction instead of silently keeping the Hibernate
# session open for the whole request (which hides N+1s behind a "working" response).
spring.jpa.open-in-view=false

# JWT: segredo (min. 32 bytes para HS256), via env var. Sem default -> fail-fast
# em JwtService se ausente, curto ou igual ao antigo default de dev
# (dev-only-secret-please-override-in-prod-32bytes+).
app.jwt.secret=${JWT_SECRET:}
# Access token de curta duracao (15 min) com iss/aud validados no parse -
# um token vazado tem janela curta e nao serve para outra origem.
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.issuer=${JWT_ISSUER:sessao-a-dois}
app.jwt.audience=${JWT_AUDIENCE:sessao-a-dois-client}

# CORS: origem do frontend (Vite dev server), sobrescrevivel via env var.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Refresh token (com.app.auth): TTL deslizante - 30 dias frescos a cada emissao,
# inclusive nas emissoes por rotacao. Sem teto absoluto de sessao (decisao E5).
app.auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:30d}

# Janela de graca da deteccao de reuso de refresh token (decisao E4): um token
# ja revogado ha menos que isso e tratado como corrida entre abas concorrentes
# (devolve o par que o substituiu) em vez de derrubar a familia inteira.
app.auth.refresh-reuse-grace=${AUTH_REFRESH_REUSE_GRACE:30s}

# Cookies de sessao (com.app.auth.AuthCookieService): flag Secure default true -
# producao nao depende de alguem lembrar de setar; dev local usa AUTH_COOKIE_SECURE=false
# para nao quebrar http://localhost.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# Rate limit (com.app.security, bucket4j em memoria - FR-2): capacidade e janela
# por endpoint. app.rate-limit.enabled=false desliga o filtro/checagem sem
# remover a infraestrutura (util para depurar localmente).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:1m}
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:3}
app.rate-limit.register.window=${RATE_LIMIT_REGISTER_WINDOW:1m}
app.rate-limit.refresh.capacity=${RATE_LIMIT_REFRESH_CAPACITY:30}
app.rate-limit.refresh.window=${RATE_LIMIT_REFRESH_WINDOW:1m}
app.rate-limit.couple-join.capacity=${RATE_LIMIT_COUPLE_JOIN_CAPACITY:5}
app.rate-limit.couple-join.window=${RATE_LIMIT_COUPLE_JOIN_WINDOW:1m}
app.rate-limit.login-by-email.capacity=${RATE_LIMIT_LOGIN_BY_EMAIL_CAPACITY:10}
app.rate-limit.login-by-email.window=${RATE_LIMIT_LOGIN_BY_EMAIL_WINDOW:1h}
app.rate-limit.couple-join-by-user.capacity=${RATE_LIMIT_COUPLE_JOIN_BY_USER_CAPACITY:20}
app.rate-limit.couple-join-by-user.window=${RATE_LIMIT_COUPLE_JOIN_BY_USER_WINDOW:1h}

# Ciclo de vida do codigo de convite (com.app.couple, US-007): tempo de vida
# do codigo gerado por CoupleService.createCouple antes de expirar.
app.couple.invite-code-ttl=${COUPLE_INVITE_CODE_TTL:7d}

# TMDB: base URL fixa e API Key obrigatoria via env var (sem default -> fail-fast em TmdbConfig se ausente).
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.api-key=${TMDB_API_KEY:}

# TMDB: timeouts do RestClient (SimpleClientHttpRequestFactory). Um TMDB instavel deve
# virar erro rapido (ResourceAccessException -> 502) em vez de segurar threads do Tomcat.
tmdb.connect-timeout=${TMDB_CONNECT_TIMEOUT:3s}
tmdb.read-timeout=${TMDB_READ_TIMEOUT:5s}
